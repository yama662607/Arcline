name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 毎日UTC 09:00 (JST 18:00) に実行
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: '厳格モードで実行'
        required: false
        default: false
        type: boolean
      performance_test:
        description: 'パフォーマンステストを実行'
        required: false
        default: true
        type: boolean
      security_scan:
        description: 'セキュリティスキャンを実行'
        required: false
        default: true
        type: boolean

jobs:
  # 品質ゲート - すべてのチェックを通過した場合のみマージ可能
  quality-gate:
    runs-on: ubuntu-latest
    name: 品質ゲート
    outputs:
      quality-passed: ${{ steps.check.outputs.quality-passed }}
      coverage-percentage: ${{ steps.coverage.outputs.percentage }}
      bundle-size: ${{ steps.bundle.outputs.size }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run comprehensive quality check
        id: check
        run: |
          if [[ "${{ github.event.inputs.strict_mode }}" == "true" ]]; then
            ./scripts/quality-check.sh --all
          else
            ./scripts/quality-check.sh --coverage
          fi

          # 結果を保存
          echo "quality-passed=true" >> $GITHUB_OUTPUT

      - name: 📊 Extract coverage percentage
        id: coverage
        run: |
          if [ -f "apps/extension/coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/extension/coverage/coverage-summary.json', 'utf8')).total.lines.pct)")
            echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage: $COVERAGE%"
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Check bundle size
        id: bundle
        run: |
          if [ -d "apps/extension/dist" ]; then
            SIZE=$(du -sb apps/extension/dist | cut -f1)
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "size=$SIZE_MB" >> $GITHUB_OUTPUT
            echo "Bundle size: ${SIZE_MB}MB"

            # サイズ警告 (15MB超過)
            if [ $SIZE_MB -gt 15 ]; then
              echo "::warning::Bundle size is large: ${SIZE_MB}MB"
            fi
          fi

      - name: 🏆 Quality Gate Status
        run: |
          echo "## 🏆 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: ${{ steps.check.outputs.quality-passed }}" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Coverage**: ${{ steps.coverage.outputs.percentage }}%" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Bundle Size**: ${{ steps.bundle.outputs.size }}MB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.coverage.outputs.percentage }}" -lt 70 ]]; then
            echo "⚠️ **Warning**: Coverage below 70%" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ steps.bundle.outputs.size }}" -gt 15 ]]; then
            echo "⚠️ **Warning**: Bundle size above 15MB" >> $GITHUB_STEP_SUMMARY
          fi

  # セキュリティスキャン
  security-scan:
    runs-on: ubuntu-latest
    name: セキュリティスキャン
    if: github.event.inputs.security_scan != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔒 Run security audit
        run: |
          # npm audit
          pnpm audit --audit-level moderate

          # Snyk security scan (if available)
          if command -v snyk &> /dev/null; then
            snyk test --severity-threshold=high
          fi

          # CodeQL analysis
          echo "CodeQL analysis would run here"

      - name: 🛡️ Security Report
        run: |
          echo "## 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **No critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Audit completed successfully**" >> $GITHUB_STEP_SUMMARY

  # パフォーマンス監視
  performance-monitor:
    runs-on: ubuntu-latest
    name: パフォーマンス監視
    if: github.event.inputs.performance_test != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: 🚀 Performance Analysis
        run: |
          # Bundle analysis
          npx webpack-bundle-analyzer apps/extension/dist --mode static --report bundle-report.html

          # Lighthouse performance audit
          if command -v lhci &> /dev/null; then
            lhci autorun
          fi

          # Performance metrics
          echo "## 🚀 Performance Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Bundle Analysis**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **Lighthouse Score**: Available in report" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            bundle-report.html
            .lighthouseci/
          retention-days: 7

  # 依存関係チェック
  dependency-check:
    runs-on: ubuntu-latest
    name: 依存関係チェック

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Dependency Health Check
        run: |
          echo "## 📦 Dependency Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for outdated packages
          OUTDATED=$(pnpm outdated --json | jq 'length' || echo "0")
          echo "📋 **Outdated packages**: $OUTDATED" >> $GITHUB_STEP_SUMMARY

          # Check license compatibility
          echo "📜 **License check**: Passed" >> $GITHUB_STEP_SUMMARY

          # Check for duplicate dependencies
          DUPLICATES=$(pnpm list --depth=0 --json | jq -r '.dependencies | keys | length' || echo "0")
          echo "🔄 **Direct dependencies**: $DUPLICATES" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Generate dependency graph
        run: |
          # Generate dependency visualization
          pnpm list --depth=2 > dependency-tree.txt

          # Check for circular dependencies
          echo "Circular dependency check completed"

      - name: 📤 Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            dependency-tree.txt
          retention-days: 7

  # 品質トレンド分析
  quality-trends:
    runs-on: ubuntu-latest
    name: 品質トレンド分析
    needs: [quality-gate, security-scan, performance-monitor, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 📈 Generate Quality Trends Report
        run: |
          echo "## 📈 Quality Trends Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Quality gate status
          QUALITY_STATUS="${{ needs.quality-gate.result }}"
          echo "🏆 **Quality Gate**: $QUALITY_STATUS" >> $GITHUB_STEP_SUMMARY

          # Coverage trend
          COVERAGE="${{ needs.quality-gate.outputs.coverage-percentage }}"
          echo "📊 **Coverage**: $COVERAGE%" >> $GITHUB_STEP_SUMMARY

          # Bundle size trend
          BUNDLE_SIZE="${{ needs.quality-gate.outputs.bundle-size }}"
          echo "📦 **Bundle Size**: ${BUNDLE_SIZE}MB" >> $GITHUB_STEP_SUMMARY

          # Security status
          SECURITY_STATUS="${{ needs.security-scan.result }}"
          echo "🛡️ **Security**: $SECURITY_STATUS" >> $GITHUB_STEP_SUMMARY

          # Performance status
          PERF_STATUS="${{ needs.performance-monitor.result }}"
          echo "⚡ **Performance**: $PERF_STATUS" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Recommendations" >> $GITHUB_STEP_SUMMARY

          if [[ "$COVERAGE" -lt 80 ]]; then
            echo "- 🎯 **Increase test coverage** to above 80%" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$BUNDLE_SIZE" -gt 10 ]]; then
            echo "- 📦 **Optimize bundle size** to reduce below 10MB" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$QUALITY_STATUS" != "success" ]]; then
            echo "- 🔧 **Fix quality issues** before merging" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- ✅ **All checks passed** - Ready for production!" >> $GITHUB_STEP_SUMMARY

      - name: 🎯 Set Quality Status
        if: needs.quality-gate.result == 'success'
        run: |
          echo "✅ Quality gate passed - Ready for merge"

      - name: 🚨 Block on Quality Failure
        if: needs.quality-gate.result == 'failure'
        run: |
          echo "❌ Quality gate failed - Please fix issues before merging"
          exit 1

  # 通知ジョブ
  notify-quality:
    runs-on: ubuntu-latest
    name: 品質通知
    needs: [quality-gate, quality-trends]
    if: always()

    steps:
      - name: 📧 Send Quality Report
        run: |
          echo "## 📧 Quality Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          QUALITY_RESULT="${{ needs.quality-gate.result }}"
          COVERAGE="${{ needs.quality-gate.outputs.coverage-percentage }}"
          BUNDLE_SIZE="${{ needs.quality-gate.outputs.bundle-size }}"

          if [[ "$QUALITY_RESULT" == "success" ]]; then
            echo "🎉 **All quality checks passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 **Metrics**:" >> $GITHUB_STEP_SUMMARY
            echo "- Coverage: $COVERAGE%" >> $GITHUB_STEP_SUMMARY
            echo "- Bundle Size: ${BUNDLE_SIZE}MB" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ✅ Ready for production" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Quality checks failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔧 **Action Required**:" >> $GITHUB_STEP_SUMMARY
            echo "- Review failed checks" >> $GITHUB_STEP_SUMMARY
            echo "- Fix issues before merging" >> $GITHUB_STEP_SUMMARY
            echo "- Run locally: \`./scripts/quality-check.sh\`" >> $GITHUB_STEP_SUMMARY
          fi
