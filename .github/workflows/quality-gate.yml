# =============================================================================
# Arcline Quality Gate Workflow
# =============================================================================
# 定期的な品質チェックと手動トリガー用ワークフロー
# - 包括的な品質チェック
# - セキュリティ監査
# - 依存関係の健全性チェック
# =============================================================================

name: Quality Gate

on:
  schedule:
    # 毎日UTC 00:00 (JST 09:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: '厳格モードで実行'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ===========================================================================
  # 品質ゲート
  # ===========================================================================
  quality-gate:
    runs-on: ubuntu-latest
    name: 🏆 Quality Gate
    outputs:
      quality-passed: ${{ steps.check.outputs.quality-passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run quality check
        id: check
        run: |
          ./scripts/quality-check.sh
          echo "quality-passed=true" >> $GITHUB_OUTPUT

      - name: 📊 Quality Summary
        run: |
          echo "## 🏆 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Passed" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # セキュリティ監査
  # ===========================================================================
  security-audit:
    runs-on: ubuntu-latest
    name: 🔒 Security Audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate || true

      - name: 📊 Security Summary
        run: |
          echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security audit completed" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # 依存関係チェック
  # ===========================================================================
  dependency-check:
    runs-on: ubuntu-latest
    name: 📦 Dependency Check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check outdated packages
        run: |
          echo "## 📦 Dependency Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outdated Packages" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pnpm outdated || true >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # 最終ステータス
  # ===========================================================================
  quality-status:
    runs-on: ubuntu-latest
    name: ✅ Quality Status
    needs: [quality-gate, security-audit, dependency-check]
    if: always()

    steps:
      - name: Check Quality Status
        run: |
          echo "## 📈 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality-gate.result }}" == "success" ]]; then
            echo "✅ **Quality Gate**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Quality Gate**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.security-audit.result }}" == "success" ]]; then
            echo "✅ **Security Audit**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Security Audit**: Check required" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.dependency-check.result }}" == "success" ]]; then
            echo "✅ **Dependency Check**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Dependency Check**: Check required" >> $GITHUB_STEP_SUMMARY
          fi

          # 品質ゲートが失敗した場合はエラー終了
          if [[ "${{ needs.quality-gate.result }}" != "success" ]]; then
            exit 1
          fi
