# =============================================================================
# Arcline Release Workflow
# =============================================================================
# タグプッシュ時に自動リリースを作成
# - pnpm によるビルド
# - 自動リリースノート生成
# - GitHub Release 作成
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*' # v1.0.0, v2.1.3 などのバージョンタグでトリガー

permissions:
  contents: write
  pull-requests: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  release:
    runs-on: ubuntu-latest
    name: 🚀 Create Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完全な履歴を取得（changelog生成用）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Create ZIP package
        run: |
          cd apps/extension
          zip -r ../../arcline-extension.zip dist/

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum arcline-extension.zip | cut -d ' ' -f 1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "SHA256: $CHECKSUM" > checksum.txt

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          # 前のタグを取得
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          # リリースノートを生成
          cat << EOF > release_notes.md
          # Arcline $CURRENT_TAG

          タブ管理を革新するChrome拡張機能

          ## 🚀 変更内容

          $(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --no-merges)

          ## 📦 インストール方法

          ### 手動インストール
          1. \`arcline-extension.zip\` をダウンロード
          2. ZIPファイルを解凍
          3. Chromeで \`chrome://extensions/\` を開く
          4. 右上の「デベロッパーモード」を有効化
          5. 「パッケージ化されていない拡張機能を読み込む」をクリック
          6. 解凍したフォルダを選択

          ## 📋 ファイル情報

          | ファイル | SHA256 チェックサム |
          |----------|---------------------|
          | arcline-extension.zip | \`${{ steps.checksum.outputs.checksum }}\` |

          ## 🔧 動作環境

          - **Chrome**: バージョン 88以上（Manifest V3対応）
          - **Edge**: バージョン 88以上（Chromiumベース）
          - **Brave**: バージョン 1.20以上

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Arcline v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            arcline-extension.zip
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
